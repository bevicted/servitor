apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: servitor
resources:
  - ../crd/bases
  - ../rbac
  - ../manager
  - ../tekton
  - ../samples
configMapGenerator:
  - name: servitor-operator-config
    files:
      - config.yaml=operator-config.yaml
    envs:
      - operator-references.env
  - name: servitor-ict-config
    files:
      - config.yaml=ict-config.yaml
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: servitor-operator-config
      fieldPath: data.SERVITOR_SLACK_SECRET
    targets:
      - select:
          kind: Deployment
          name: servitor-controller-manager
        fieldPaths:
          - spec.template.spec.containers.[name=manager].envFrom.0.secretRef.name
images:
  - name: registry.example.invalid/servitor-operator
    newName: registry.example.invalid/servitor-operator
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
