apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: servitor-operation
spec:
  params:
    - { name: operation-id, type: string }
    - { name: operation-kind, type: string }
    - { name: cluster-uid, type: string }
    - { name: execution-image, type: string }
    - { name: resolved-options, type: string }
    - { name: backend, type: string }
    - { name: recovery, type: string, default: "" }
    - { name: ict-config-map, type: string }
    - { name: ict-config-key, type: string }
    - { name: cos-secret, type: string }
    - { name: ibm-secret, type: string }
  stepTemplate:
    env:
      - name: HOME
        value: /tekton/home
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
  volumes:
    - name: operation-data
      emptyDir: {}
    - name: tmp
      emptyDir: {}
    - name: ict-config
      configMap:
        name: $(params.ict-config-map)
        items:
          - key: $(params.ict-config-key)
            path: config.yaml
  steps:
    - name: execute
      image: $(params.execution-image)
      command: ["/usr/local/bin/servitor-task"]
      args:
        - -cluster-uid
        - $(params.cluster-uid)
        - -operation-id
        - $(params.operation-id)
        - -operation-kind
        - $(params.operation-kind)
        - -resolved-options
        - /operation/options.json
        - -resolved-options-json
        - $(params.resolved-options)
        - -backend-config
        - /operation/backend.json
        - -backend-json
        - $(params.backend)
        - -recovery
        - /operation/recovery.json
        - -recovery-json
        - $(params.recovery)
        - -ict-result
        - /operation/ict-result.json
        - -report
        - /operation/report.json
        - -planning-inventory-config
        - /etc/servitor/ict/config.yaml
      env:
        - name: ICT_CONFIG
          value: /etc/servitor/ict/config.yaml
        - name: TMPDIR
          value: /tmp
      envFrom:
        - secretRef: { name: $(params.cos-secret) }
        - secretRef: { name: $(params.ibm-secret) }
      volumeMounts:
        - { name: operation-data, mountPath: /operation }
        - { name: tmp, mountPath: /tmp }
        - { name: ict-config, mountPath: /etc/servitor/ict, readOnly: true }
    - name: report
      image: $(params.execution-image)
      command: ["/usr/local/bin/servitor-task"]
      args: ["-emit-report", "/operation/report.json"]
      volumeMounts: [{ name: operation-data, mountPath: /operation }]
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: servitor-operation
spec:
  params:
    - { name: operation-id, type: string }
    - { name: operation-kind, type: string }
    - { name: cluster-uid, type: string }
    - { name: execution-image, type: string }
    - { name: resolved-options, type: string }
    - { name: backend, type: string }
    - { name: recovery, type: string, default: "" }
    - { name: ict-config-map, type: string }
    - { name: ict-config-key, type: string }
    - { name: cos-secret, type: string }
    - { name: ibm-secret, type: string }
  tasks:
    - name: operation
      taskRef: { name: servitor-operation }
      timeout: 95m
      params:
        - { name: operation-id, value: $(params.operation-id) }
        - { name: operation-kind, value: $(params.operation-kind) }
        - { name: cluster-uid, value: $(params.cluster-uid) }
        - { name: execution-image, value: $(params.execution-image) }
        - { name: resolved-options, value: $(params.resolved-options) }
        - { name: backend, value: $(params.backend) }
        - { name: recovery, value: $(params.recovery) }
        - { name: ict-config-map, value: $(params.ict-config-map) }
        - { name: ict-config-key, value: $(params.ict-config-key) }
        - { name: cos-secret, value: $(params.cos-secret) }
        - { name: ibm-secret, value: $(params.ibm-secret) }
