apiVersion: v1
kind: ServiceAccount
metadata:
  name: servitor-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servitor-controller-manager
  labels:
    app.kubernetes.io/name: servitor
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: servitor
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: servitor
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: servitor-controller
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 0
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: manager
          image: registry.example.invalid/servitor-operator@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          args: ["-config", "/etc/servitor/config/config.yaml"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: SERVITOR_ICT_CONFIG_MAP
              valueFrom:
                configMapKeyRef:
                  {
                    name: servitor-operator-config,
                    key: SERVITOR_ICT_CONFIG_MAP,
                  }
            - name: SERVITOR_ICT_CONFIG_KEY
              valueFrom:
                configMapKeyRef:
                  {
                    name: servitor-operator-config,
                    key: SERVITOR_ICT_CONFIG_KEY,
                  }
            - name: SERVITOR_SLACK_SECRET
              valueFrom:
                configMapKeyRef:
                  { name: servitor-operator-config, key: SERVITOR_SLACK_SECRET }
            - name: SERVITOR_COS_SECRET
              valueFrom:
                configMapKeyRef:
                  { name: servitor-operator-config, key: SERVITOR_COS_SECRET }
            - name: SERVITOR_IBM_SECRET
              valueFrom:
                configMapKeyRef:
                  { name: servitor-operator-config, key: SERVITOR_IBM_SECRET }
          envFrom:
            - secretRef: { name: SERVITOR_SLACK_SECRET }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - {
                name: operator-config,
                mountPath: /etc/servitor/config,
                readOnly: true,
              }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: operator-config
          configMap:
            name: servitor-operator-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: tmp
          emptyDir: {}
