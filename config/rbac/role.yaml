apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: servitor-controller
rules:
  - apiGroups: [servitor.bevicted.github.io]
    resources: [servitorclusters]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [servitor.bevicted.github.io]
    resources: [servitorclusters/status]
    verbs: [get, update, patch]
  - apiGroups: [servitor.bevicted.github.io]
    resources: [servitorclusters/finalizers]
    verbs: [update]
  - apiGroups: [tekton.dev]
    resources: [pipelineruns]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [tekton.dev]
    resources: [taskruns]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: servitor-controller
subjects:
  - kind: ServiceAccount
    name: servitor-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: servitor-controller
