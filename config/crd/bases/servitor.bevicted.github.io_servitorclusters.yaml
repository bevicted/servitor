apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servitorclusters.servitor.bevicted.github.io
spec:
  group: servitor.bevicted.github.io
  names:
    kind: ServitorCluster
    listKind: ServitorClusterList
    plural: servitorclusters
    singular: servitorcluster
    shortNames: [svccluster]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [slack, lifecycle]
              properties:
                slack:
                  type: object
                  required: [ownerID, channelID, threadTimestamp]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: slack identity is immutable
                  properties:
                    ownerID:
                      {
                        type: string,
                        minLength: 1,
                        maxLength: 128,
                        pattern: "^[A-Z0-9]+$",
                      }
                    channelID:
                      {
                        type: string,
                        minLength: 1,
                        maxLength: 128,
                        pattern: "^[A-Z0-9]+$",
                      }
                    threadTimestamp:
                      {
                        type: string,
                        minLength: 1,
                        maxLength: 64,
                        pattern: '^[0-9]+\.[0-9]+$',
                      }
                userOptions:
                  type: object
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: userOptions are immutable
                  properties:
                    target:
                      {
                        type: string,
                        maxLength: 128,
                        pattern: "^[A-Za-z0-9._-]*$",
                      }
                    provider:
                      { type: string, enum: [vpc-gen2, classic, satellite] }
                    platform: { type: string, enum: [kubernetes, openshift] }
                    version:
                      {
                        type: string,
                        maxLength: 32,
                        pattern: '^[0-9]+\.[0-9]+(\.[0-9]+)?(_openshift)?$',
                      }
                    resourceGroup: { type: string, maxLength: 128 }
                    zone:
                      {
                        type: string,
                        maxLength: 64,
                        pattern: "^[a-z]+(-[a-z]+)+-[0-9]+$",
                      }
                    flavor: { type: string, maxLength: 64 }
                    vpcID: { type: string, maxLength: 128 }
                    datacenter:
                      { type: string, maxLength: 32, pattern: "^[a-z]+[0-9]+$" }
                    machineType: { type: string, maxLength: 64 }
                    publicVLANID:
                      { type: string, maxLength: 64, pattern: "^[0-9]*$" }
                    privateVLANID:
                      { type: string, maxLength: 64, pattern: "^[0-9]*$" }
                    subnetIDs:
                      {
                        type: array,
                        maxItems: 8,
                        items: { type: string, maxLength: 128 },
                      }
                    publicGatewayIDs:
                      {
                        type: array,
                        maxItems: 8,
                        items: { type: string, maxLength: 128 },
                      }
                    satelliteZones:
                      {
                        type: array,
                        maxItems: 3,
                        items: { type: string, maxLength: 64 },
                      }
                    satelliteManagedFrom: { type: string, maxLength: 128 }
                    satelliteLocationID: { type: string, maxLength: 128 }
                    satelliteHostImage: { type: string, maxLength: 256 }
                    satelliteHostProfile: { type: string, maxLength: 64 }
                    satelliteSSHKeyID: { type: string, maxLength: 128 }
                    satelliteWorkerInstanceIDs:
                      {
                        type: array,
                        maxItems: 32,
                        items: { type: string, maxLength: 128 },
                      }
                    satelliteWorkerOperatingSystem:
                      { type: string, maxLength: 64 }
                    name:
                      {
                        type: string,
                        maxLength: 64,
                        pattern: "^[a-z][a-z0-9-]*$",
                      }
                    workerCount: { type: integer, minimum: 1, maximum: 100 }
                lifecycle:
                  type: object
                  required: [initialLeaseSeconds, retrySeconds]
                  properties:
                    confirmationDeadline: { type: string, format: date-time }
                    initialLeaseSeconds:
                      { type: integer, minimum: 3600, maximum: 86400 }
                    retrySeconds:
                      {
                        type: array,
                        minItems: 1,
                        maxItems: 8,
                        items: { type: integer, minimum: 1, maximum: 86400 },
                      }
                    approval: { type: string, enum: ["", approved, rejected] }
                    requestedExpiry: { type: string, format: date-time }
            status:
              type: object
              properties:
                phase:
                  {
                    type: string,
                    enum: [Pending, Planning, AwaitingApproval, Unresolved],
                  }
                conditions:
                  {
                    type: array,
                    maxItems: 16,
                    items:
                      {
                        type: object,
                        x-kubernetes-preserve-unknown-fields: true,
                      },
                  }
                executionImage: { type: string, maxLength: 512 }
                resolvedOptions:
                  type: object
                  properties:
                    target: { type: string, maxLength: 128 }
                    provider:
                      { type: string, enum: [vpc-gen2, classic, satellite] }
                    platform: { type: string, enum: [kubernetes, openshift] }
                    version: { type: string, maxLength: 32 }
                    resourceGroup: { type: string, maxLength: 128 }
                    zone: { type: string, maxLength: 64 }
                    flavor: { type: string, maxLength: 64 }
                    vpcID: { type: string, maxLength: 128 }
                    datacenter: { type: string, maxLength: 32 }
                    machineType: { type: string, maxLength: 64 }
                    publicVLANID: { type: string, maxLength: 64 }
                    privateVLANID: { type: string, maxLength: 64 }
                    satelliteManagedFrom: { type: string, maxLength: 128 }
                    satelliteLocationID: { type: string, maxLength: 128 }
                    satelliteHostImage: { type: string, maxLength: 256 }
                    satelliteHostProfile: { type: string, maxLength: 64 }
                    satelliteSSHKeyID: { type: string, maxLength: 128 }
                    satelliteWorkerOperatingSystem:
                      { type: string, maxLength: 64 }
                    name: { type: string, maxLength: 64 }
                    workerCount: { type: integer, minimum: 1, maximum: 100 }
                    clusterName: { type: string, maxLength: 128 }
                    region: { type: string, maxLength: 64 }
                    subnetIDs:
                      {
                        type: array,
                        maxItems: 8,
                        items: { type: string, maxLength: 128 },
                      }
                    publicGatewayIDs:
                      {
                        type: array,
                        maxItems: 8,
                        items: { type: string, maxLength: 128 },
                      }
                    satelliteZones:
                      {
                        type: array,
                        maxItems: 3,
                        items: { type: string, maxLength: 64 },
                      }
                    satelliteWorkerInstanceIDs:
                      {
                        type: array,
                        maxItems: 32,
                        items: { type: string, maxLength: 128 },
                      }
                backend:
                  type: object
                  properties:
                    version: { type: integer, minimum: 1, maximum: 1 }
                    bucket: { type: string, maxLength: 63 }
                    key: { type: string, maxLength: 1024 }
                    region: { type: string, maxLength: 64 }
                    endpoint: { type: string, maxLength: 512 }
                    skipCredentialsValidation: { type: boolean }
                    skipMetadataAPICheck: { type: boolean }
                    skipRegionValidation: { type: boolean }
                    skipRequestingAccountID: { type: boolean }
                    forcePathStyle: { type: boolean }
                    useLockfile: { type: boolean }
                operation:
                  {
                    type: object,
                    properties:
                      {
                        id: { type: string, maxLength: 64 },
                        kind: { type: string },
                        pipelineRunName: { type: string, maxLength: 63 },
                        startedAt: { type: string, format: date-time },
                        adopted: { type: boolean },
                      },
                  }
                review:
                  {
                    type: object,
                    properties:
                      {
                        resources:
                          {
                            type: array,
                            maxItems: 256,
                            items:
                              {
                                type: object,
                                properties:
                                  {
                                    role: { type: string, maxLength: 64 },
                                    id: { type: string, maxLength: 256 },
                                    name: { type: string, maxLength: 256 },
                                    actions:
                                      {
                                        type: array,
                                        maxItems: 2,
                                        items: { type: string },
                                      },
                                    reused: { type: boolean },
                                  },
                              },
                          },
                      },
                  }
                recovery:
                  type: object
                  properties:
                    version: { type: integer }
                    target: { type: string }
                    endpoints:
                      { type: object, additionalProperties: { type: string } }
                    tfvarsSHA256: { type: string, maxLength: 64 }
                    values:
                      {
                        type: object,
                        x-kubernetes-preserve-unknown-fields: true,
                      }
                reviewDeadline: { type: string, format: date-time }
                diagnostic: { type: string, maxLength: 128 }
