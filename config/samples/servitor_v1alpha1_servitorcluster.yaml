# The controller adds the cleanup finalizer and is the only status writer.
# userOptions is explicit-only; deployment defaults are frozen in
# status.resolvedOptions before planning. lifecycle is desired intent/policy.
apiVersion: servitor.bevicted.github.io/v1alpha1
kind: ServitorCluster
metadata:
  name: example
spec:
  slack:
    ownerID: U_REPLACE_ME
    channelID: C_REPLACE_ME
    threadTimestamp: "0.0"
  userOptions: {}
  lifecycle:
    initialLeaseSeconds: 14400
    retrySeconds: [60, 300, 900]
