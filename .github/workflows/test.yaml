name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make test

  publish:
    needs: test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'bevicted/servitor'
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/publish.yaml
