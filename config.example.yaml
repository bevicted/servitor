# Non-secret OpenShift operator configuration. Mount this through the
# servitor-operator-config ConfigMap; do not put credential values, host paths,
# local state, or log locations here. The controller snapshots these defaults
# into each CR status before planning.
namespace: servitor
slack:
  channel_id: C_REPLACE_ME
defaults:
  version: "4.22"
  target: REPLACE_ME
  provider: vpc-gen2
  resource_group: Default
  zone: us-south-1
  vpc_id: REPLACE_ME
  openshift_flavor: bx2.4x16
  kubernetes_flavor: bx2.2x8
# This policy is copied into spec.lifecycle for each allocation. The controller
# alone writes observed phase, deadlines, operations, retries, and summaries.
lifecycle:
  confirmation_timeout: 5m
  lease: 4h
  retry_intervals: [1m, 5m, 15m]
ict:
  target_config_map: servitor-ict-config
  target_config_key: config.yaml
# Terraform state is stored in this COS S3 backend. HMAC values belong only in
# the referenced Secret and never in a CR, status, result, or command argument.
cos:
  endpoint: https://s3.us-south.cloud-object-storage.appdomain.cloud
  bucket: REPLACE_ME
  region: us-south
  key_prefix: servitor
  skip_credentials_validation: true
  skip_metadata_api_check: true
  skip_region_validation: true
  skip_requesting_account_id: true
  force_path_style: true
  use_lockfile: false
images:
  # Use the immutable digest built by `make task-image`; it is frozen per CR.
  execution: registry.example.invalid/servitor-task@sha256:REPLACE_WITH_64_HEX_DIGEST
secrets:
  # These are names only. Values remain in existing namespace Secrets.
  slack: servitor-slack-credentials
  cos: servitor-cos-credentials
  ibm: servitor-ibm-credentials
